name: Build and Release

# vX.Y.Z 形式のタグをpushすると自動的に実行されます
on:
  push:
    tags:
      - 'v*'

# GitHub Releaseを作成・アップロードするために必須(組織所有のリポジトリでは
# リポジトリ設定の「Read and write permissions」だけでは不十分な場合があるため、
# ここでも明示的に権限を宣言しておく)
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージをインストール
        run: npm install

      - name: ビルドしてGitHub Releaseに公開
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
